<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Post</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Create New Posts</h1>

<form action="/create_post" method="POST">
    <input type="text" name="title" placeholder="Title" size="60"><br><br>
    <textarea name="content" rows="8" cols="80" placeholder="Write your post..."></textarea><br><br>
    <button type="submit">Create Post</button>
</form>

</body>
</html>
